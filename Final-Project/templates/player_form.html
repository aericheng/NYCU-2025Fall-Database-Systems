{% extends 'base.html' %}
{% block content %}
<div class="mb-4">
    <a href="/players" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back to Players</a>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-white">
                <h4 class="mb-0">
                    <i class="bi bi-{% if x %}pencil{% else %}plus-circle{% endif %}"></i>
                    {% if x %}Edit Player{% else %}Add New Player{% endif %}
                </h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Player Name <span class="text-danger">*</span></label>
                        <input type="text" name="n" class="form-control" value="{{x.player_name if x else ''}}" required placeholder="Enter player name">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Team</label>
                            <select name="t" class="form-select">
                                <option value="">-- Select Team --</option>
                                {% for i in t %}
                                <option value="{{i.team_id}}" {% if x and x.team_id == i.team_id %}selected{% endif %}>{{i.team_name}}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Position</label>
                            <input type="text" name="pos" class="form-control" value="{{x.position if x else ''}}" placeholder="e.g., Guard, Forward">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Height</label>
                            <input type="text" name="h" class="form-control" value="{{x.height if x else ''}}" placeholder="e.g., 6-6">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Weight (lbs)</label>
                            <input type="number" name="w" class="form-control" value="{{x.weight if x else ''}}" placeholder="e.g., 220">
                        </div>
                    </div>

                    {% if not x %}
                    <div class="mb-3">
                        <label class="form-label">Birth Date</label>
                        <input type="date" name="b" class="form-control">
                    </div>
                    {% endif %}

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg"></i> Save
                        </button>
                        <a href="/players" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
