{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="bi bi-building"></i> Teams</h1>
</div>

<div class="card">
    <div class="table-responsive">
        <table class="table table-striped table-hover mb-0">
            <thead>
                <tr>
                    <th>Abbreviation</th>
                    <th>Team Name</th>
                    <th>City</th>
                    <th>Conference</th>
                    <th>Division</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for x in t %}
                <tr>
                    <td><span class="badge bg-primary">{{x.abbreviation}}</span></td>
                    <td><strong>{{x.team_name}}</strong></td>
                    <td>{{x.city}}</td>
                    <td>{{x.conference or '-'}}</td>
                    <td>{{x.division or '-'}}</td>
                    <td><a href="/teams/{{x.team_id}}" class="btn btn-sm btn-primary"><i class="bi bi-eye"></i> View</a></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
