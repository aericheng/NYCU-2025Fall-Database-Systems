<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --nba-blue: #1d428a;
            --nba-red: #c8102e;
            --nba-gold: #fdb927;
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(90deg, var(--nba-blue) 0%, #2d5aa8 100%);
            box-shadow: 0 2px 15px rgba(0,0,0,0.2);
        }
        .navbar-brand {
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--nba-gold) !important;
        }
        .nav-link {
            color: rgba(255,255,255,0.9) !important;
            font-weight: 500;
            transition: all 0.3s ease;
            border-radius: 8px;
            margin: 0 2px;
        }
        .nav-link:hover {
            color: var(--nba-gold) !important;
            background: rgba(255,255,255,0.1);
        }
        .container {
            max-width: 1200px;
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }
        .table {
            margin-bottom: 0;
        }
        .table thead th {
            background: var(--nba-blue);
            color: white;
            font-weight: 600;
            border: none;
            padding: 12px 16px;
        }
        .table tbody td {
            padding: 12px 16px;
            vertical-align: middle;
        }
        .table-striped tbody tr:nth-of-type(odd) {
            background-color: rgba(29, 66, 138, 0.03);
        }
        .table tbody tr:hover {
            background-color: rgba(29, 66, 138, 0.08);
        }
        .btn-primary {
            background: var(--nba-blue);
            border: none;
            padding: 8px 20px;
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: #2d5aa8;
            transform: translateY(-1px);
        }
        .btn-danger {
            background: var(--nba-red);
            border: none;
        }
        .btn-success {
            background: #28a745;
            border: none;
        }
        .btn-outline-light:hover {
            background: var(--nba-gold);
            color: var(--nba-blue) !important;
        }
        .page-header {
            background: linear-gradient(135deg, var(--nba-blue) 0%, #2d5aa8 100%);
            color: white;
            padding: 40px 0;
            margin-bottom: 30px;
            border-radius: 0 0 30px 30px;
        }
        .page-header h1 {
            font-weight: 700;
            margin: 0;
        }
        .badge-team {
            background: var(--nba-blue);
            font-weight: 500;
            padding: 6px 12px;
        }
        .stat-card {
            text-align: center;
            padding: 20px;
        }
        .stat-card .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--nba-blue);
        }
        .stat-card .stat-label {
            color: #6c757d;
            font-weight: 500;
        }
        .flash-message {
            border-radius: 10px;
            padding: 15px 20px;
        }
        a {
            color: var(--nba-blue);
            text-decoration: none;
            transition: color 0.2s ease;
        }
        a:hover {
            color: var(--nba-red);
        }
        .form-control, .form-select {
            border-radius: 8px;
            padding: 10px 15px;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--nba-blue);
            box-shadow: 0 0 0 0.2rem rgba(29, 66, 138, 0.15);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-dribbble"></i> NBA DB</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-house-door"></i> Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/players"><i class="bi bi-people"></i> Players</a></li>
                    <li class="nav-item"><a class="nav-link" href="/teams"><i class="bi bi-building"></i> Teams</a></li>
                    <li class="nav-item"><a class="nav-link" href="/games"><i class="bi bi-calendar-event"></i> Games</a></li>
                    <li class="nav-item"><a class="nav-link" href="/stats"><i class="bi bi-bar-chart"></i> Stats</a></li>
                    <li class="nav-item"><a class="nav-link" href="/leaders"><i class="bi bi-trophy"></i> Leaders</a></li>
                    <li class="nav-item"><a class="nav-link" href="/standings"><i class="bi bi-list-ol"></i> Standings</a></li>
                    <li class="nav-item"><a class="nav-link" href="/headtohead"><i class="bi bi-arrow-left-right"></i> H2H</a></li>
                    <li class="nav-item"><a class="nav-link" href="/compare"><i class="bi bi-arrows-angle-expand"></i> Compare</a></li>
                    <li class="nav-item"><a class="nav-link" href="/players/filter"><i class="bi bi-funnel"></i> Filter</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown"><i class="bi bi-download"></i> Export</a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="/export/players"><i class="bi bi-file-earmark-spreadsheet"></i> Players CSV</a></li>
                            <li><a class="dropdown-item" href="/export/stats"><i class="bi bi-file-earmark-spreadsheet"></i> Stats CSV</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% for m in get_flashed_messages() %}
        <div class="alert alert-success flash-message" role="alert">
            <i class="bi bi-check-circle"></i> {{ m }}
        </div>
        {% endfor %}
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center text-muted py-4 mt-5">
        <small>NBA Database System - 113950011 & 113950012</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
